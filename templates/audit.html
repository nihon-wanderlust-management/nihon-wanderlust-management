{% extends 'base.html' %}{% block content %}<div class="title"><div><h1>Audit Log</h1><p>Recent activity.</p></div></div><div class="panel table"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th><th>Detail</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.user_name or 'System'}}</td><td>{{r.action}}</td><td>{{r.entity}}</td><td>{{r.entity_id or ''}}</td><td>{{r.detail or ''}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
